  - {consumer: qiven-runtime, pinned: qiven-context-draft, sha: ea9af72dd53b227a4f17142b0d437dfbb6148dbe, equals_canonical_main: true}
  - {consumer: qiven-runtime, pinned: qiven-third-party-win, sha: 318453834315a68fa85374dffa9a77ff73d6e71c, equals_canonical_main: true}
  - {consumer: qiven-context-draft, pinned: qiven-foundation, sha: f28b86b0448c7b08c64f6c4bc11e0c327d240212, equals_canonical_main: true}
  - {consumer: qiven-math, pinned: qiven-foundation, sha: f28b86b0448c7b08c64f6c4bc11e0c327d240212, equals_canonical_main: true}
  - {consumer: qiven-context, pinned: qiven-devkit, sha: d1d2a3a47678..., equals_canonical_main: false, split_note: 'devkit main 94ee01e; the only stale pin in the workspace'}

baseline_splits:
  - 'devkit implementation split: context imports d1d2a3a via shim+pin; C++ repos execute template-0.1.9 managed snapshots; devkit main is 94ee01e'
  - 'all CMake pins verified equal to canonical main HEADs except the context devkit pin (stale by owner choice, bump optional)'

digest_note: >-
  sha256 of this file (LF, UTF-8, as committed) computed by two
  independent implementations (python hashlib + certutil) and recorded
  in wr0-report.md; the census is the WR-1 resolver's first shadow
  input.
