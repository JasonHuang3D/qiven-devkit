authority: 'ADR-0052 (qiven-context, accepted 2026-09-24); program docs qiven-docs accepted/2026-09-24/02-* WR-0'
inputs_note: >-
  Reuses the CA-0 source inventory (qiven-context PR #128, 2026-09-24
  exit report) without reopening it; charges nothing to the CA-1 batch.
  Every edge below carries live file:line evidence verified 2026-09-24.

