name: CI

run-name: CI / ${{ inputs.jobs }}

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "Validation units: full, windows, linux, macos"
        required: true
        default: full
        type: string

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        shell: bash
        env:
          REQUESTED: ${{ inputs.jobs }}
        run: |
          case "$REQUESTED" in
            full) matrix='[{"name":"Windows","os":"windows-2022"},{"name":"Linux","os":"ubuntu-24.04"},{"name":"macOS","os":"macos-15"}]' ;;
            windows) matrix='[{"name":"Windows","os":"windows-2022"}]' ;;
            linux) matrix='[{"name":"Linux","os":"ubuntu-24.04"}]' ;;
            macos) matrix='[{"name":"macOS","os":"macos-15"}]' ;;
            *)
              echo "Unknown validation unit: $REQUESTED" >&2
              echo "  WHY: the plan is the typed admission surface - an unknown unit" >&2
              echo "  would validate nothing while appearing to run CI (rule: devkit/ci-plan)" >&2
              echo "  NEXT action: FIX - re-dispatch with jobs=full or one of:" >&2
              echo "  windows, linux, macos" >&2
              exit 1 ;;
          esac
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
  test:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - run: cmake -DDEVKIT_ROOT="${{ github.workspace }}" -P tools/test.cmake
  ci-gate:
    name: CI Gate
    if: ${{ always() }}
    needs: [plan, test]
    runs-on: ubuntu-24.04
    steps:
      - shell: bash
        env:
          PLAN: ${{ needs.plan.result }}
          TEST: ${{ needs.test.result }}
        run: |
          set -euo pipefail
          if [[ "$PLAN" != "success" || "$TEST" != "success" ]]; then
            echo "[FAIL] CI Gate: WHY: a requested validation unit did not succeed"
            echo "  (plan=$PLAN, test=$TEST; rule: devkit/ci-gate - the gate"
            echo "  conclusion is the enforcement)"
            echo "  NEXT action: DIAGNOSE - open the failed unit's step logs"
            echo "  (gh run view --log-failed, or qiven ci watch), classify the"
            echo "  failure, fix it at this head, then re-dispatch; a re-dispatch"
            echo "  without a fix is not a retry."
            exit 1
          fi
          echo "CI Gate: requested validation passed"
